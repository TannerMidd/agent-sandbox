name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore AgentSandbox.slnx --configfile NuGet.Config
      - name: Build application
        run: dotnet build src/AgentSandbox.App/AgentSandbox.App.csproj --configuration Release --no-restore -p:Platform=x64 -p:CI=true
      - name: Build setup helper
        run: dotnet build src/AgentSandbox.SetupHelper/AgentSandbox.SetupHelper.csproj --configuration Release --no-restore -p:Platform=x64 -p:CI=true
      - name: Test .NET
        run: |
          dotnet test tests/AgentSandbox.Domain.Tests/AgentSandbox.Domain.Tests.csproj --configuration Release --no-restore -p:CI=true
          dotnet test tests/AgentSandbox.Application.Tests/AgentSandbox.Application.Tests.csproj --configuration Release --no-restore -p:CI=true
          dotnet test tests/AgentSandbox.Infrastructure.Tests/AgentSandbox.Infrastructure.Tests.csproj --configuration Release --no-restore -p:CI=true
          dotnet test tests/AgentSandbox.Ui.Tests/AgentSandbox.Ui.Tests.csproj --configuration Release --no-restore -p:CI=true
      - name: Test guest helper
        run: python tests/guest_helper_tests.py
      - name: Publish x64 app and helper
        run: dotnet publish src/AgentSandbox.App/AgentSandbox.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:CI=true -p:PublishDir=${{ github.workspace }}\artifacts\publish\
      - name: Build installable test package
        run: dotnet build installer/AgentSandbox.Installer.wixproj --configuration Release --no-restore -p:PublishDir=${{ github.workspace }}\artifacts\publish -p:PackageVersion=0.1.${{ github.run_number }}
      - name: Create package checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\package | Out-Null
          Copy-Item installer\bin\x64\Release\AgentSandbox-x64.msi artifacts\package\AgentSandbox-x64-unsigned.msi
          $package = Get-Item artifacts\package\AgentSandbox-x64-unsigned.msi
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -NoNewline -LiteralPath "$($package.FullName).sha256"
      - name: Upload installable test package
        uses: actions/upload-artifact@v7
        with:
          name: agent-sandbox-main-${{ github.run_number }}-x64
          path: |
            artifacts/package/AgentSandbox-x64-unsigned.msi
            artifacts/package/AgentSandbox-x64-unsigned.msi.sha256
          if-no-files-found: error
